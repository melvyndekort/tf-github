visibility: public
description: "Discord-driven just-in-time elevation for IAM Identity Center permission sets"
profile: terraform-workload

# aws_account + aws_plan_kms_target intentionally NOT set yet. Setting
# aws_account on a repo that doesn't exist yet makes its name a new key in
# github-oidc-roles.tf's oidc_repos_by_account map, whose VALUE (the GitHub
# repo_id) is only known after this repo is created -- Terraform can't plan
# a for_each over a map value that's "known only after apply" (confirmed
# live: tf-github#67's first version hit exactly this with aws_account set).
# Same two-phase pattern as tf-aws's own subaccount bootstrap: create first,
# connect to AWS in a follow-up PR once the repo (and its repo_id) exists.
