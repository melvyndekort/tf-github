visibility: public
description: "This repository contains my ignition files for Fedora CoreOS"
aws_account: "075673041815"
aws_apply_full_admin: true  # TEMPORARY - escape hatch during PowerUserAccess rollout (tf-github-redesign-plan-2026-10.md §4.2a). Flip to false once this repo has applied successfully under the scoped policy.
# No GitHub Actions workflow exists in this repo (confirmed via full git
# history) to declare `environment: production`, so this flag is
# defense-in-depth only: it narrows the AdministratorAccess OIDC role's
# trust to the environment subject even though nothing currently assumes
# it that way. See melvyndekort/tf-github#36.
production_environment: true
allowed_actions_config: []
secrets:
  - name: CLOUDFLARE_ACCOUNT_ID
    value_ref: cloudflare_account_id
  - name: CLOUDFLARE_API_TOKEN
    value_ref: tf_cloudflare.api_token_ignition
